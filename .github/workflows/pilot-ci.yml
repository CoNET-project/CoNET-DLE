name: Pilot CI

on:
  pull_request:
    paths:
      - "pilot/**"
      - "evidence/**"
      - "docs/pilot/**"
      - ".github/workflows/pilot-ci.yml"
  push:
    paths:
      - "pilot/**"
      - "evidence/**"
      - "docs/pilot/**"
      - ".github/workflows/pilot-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: pilot/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run dry-run -- --output "${RUNNER_TEMP}/conet-dle-pilot-dry-run"
